name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

# The default token could write to the repo; CI only needs to read it, so a
# workflow run (including one from a pull request) can't push or change settings.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The stated minimum (pyproject requires-python) and the newest versions.
        python-version: ["3.11", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run lint, type-check, and tests
        run: bash lint.sh
