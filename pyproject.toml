[build-system]
requires = ["setuptools>=77"]  # 77: first to accept a PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "mydocbot"
version = "0.1.0"
description = "Terminal note-taker that prepends timestamped notes to Google Docs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Matias M"}]
requires-python = ">=3.11"
# Direct runtime dependencies as ranges, for `pipx install -e .`. Exact,
# tested pins live in requirements.txt; test/lint tools in requirements-dev.txt.
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "httplib2>=0.19",
    "textual>=8.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# The Discord bot (mydocbot-discord); install with: pip install -e '.[discord]'
discord = ["discord.py>=2.4"]

[project.scripts]
mydocbot = "main:main"
mydocbot-discord = "discord_bot:main"

[project.urls]
Homepage = "https://github.com/matrixel-ps/MyDocBot"
Repository = "https://github.com/matrixel-ps/MyDocBot"
Issues = "https://github.com/matrixel-ps/MyDocBot/issues"

[tool.setuptools]
py-modules = ["main", "mydocbot_app", "discord_bot"]
packages = ["core"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["UP006", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# What coverage.sh measures (D3). Report only: nothing fails on a percentage.
source = ["core", "main", "mydocbot_app", "discord_bot"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
