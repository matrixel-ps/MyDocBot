[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mydocbot"
version = "0.1.0"
description = "Terminal note-taker that prepends timestamped notes to Google Docs"
readme = "README.md"
requires-python = ">=3.10"
# Direct runtime dependencies as ranges, for `pipx install -e .`. Exact,
# tested pins live in requirements.txt; test/lint tools in requirements-dev.txt.
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "httplib2>=0.19",
    "textual>=8.0",
    "rich>=13.0.0",
]

[project.scripts]
mydocbot = "main:main"

[tool.setuptools]
py-modules = ["main", "mydocbot_app"]
packages = ["core"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["UP006", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
